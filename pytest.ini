[pytest]
# Only collect the offline suite in tests/. The legacy test_*.py scripts in the
# repository root download the UCI Adult dataset and call the live Groq API, so
# they are run manually, not as part of the automated suite.
testpaths = tests
pythonpath = .
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
