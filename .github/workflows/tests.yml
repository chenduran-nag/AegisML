name: tests

# The suite is fully offline (synthetic fixtures, stubbed planner), so it needs no
# secrets and no network beyond installing dependencies.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
